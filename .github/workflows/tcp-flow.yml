name: TCP Flow Control

on:
  pull_request:
    branches: [feat/deny-events]

permissions:
  contents: read

jobs:
  guest-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo test --locked -p microsandbox-agentd -p microsandbox-protocol
      - run: rustfmt --edition 2024 --check crates/agentd/lib/tcp.rs crates/agentd/lib/agent.rs crates/protocol/lib/tcp.rs crates/protocol/lib/message.rs
  transport-and-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev libelf-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
          cache-on-failure: true
      - run: cargo test --locked -p microsandbox-agent-client --features uds --lib
      - run: cargo test --locked -p microsandbox-runtime --lib relay::tests
      - run: cargo test --locked -p microsandbox --features ssh --lib sandbox::ssh
      - run: cargo check --locked --manifest-path sdk/go/native/Cargo.toml
      - run: cargo clippy --locked -p microsandbox-agent-client -p microsandbox-runtime -p microsandbox --features microsandbox/ssh,microsandbox-agent-client/uds --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2024 --config skip_children=true --check vendor/russh/src/server/mod.rs vendor/russh/src/server/session.rs vendor/russh/src/server/encrypted.rs
  typescript-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-client/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
