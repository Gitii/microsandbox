name: TCP Flow Control

on:
  pull_request:
    branches: [feat/deny-events]

permissions:
  contents: read

jobs:
  guest-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo test --locked -p microsandbox-agentd -p microsandbox-protocol
      - run: rustfmt --edition 2024 --check crates/agentd/lib/tcp.rs crates/agentd/lib/agent.rs crates/protocol/lib/tcp.rs crates/protocol/lib/message.rs
  typescript-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-client/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
