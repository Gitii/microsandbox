[package]
name = "microsandbox-db"
description = "Shared database entity definitions and connection helpers for the microsandbox project."
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "microsandbox_db"
path = "lib/lib.rs"

[features]
# Remote catalog backend: connect to a self-hosted libSQL server (sqld)
# instead of opening the SQLite file directly.
libsql = ["dep:libsql", "sea-orm/proxy"]

[dependencies]
async-trait = "0.1"
chrono.workspace = true
libsql = { version = "0.9", default-features = false, features = ["remote", "tls"], optional = true }
sea-orm.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
microsandbox-migration = { path = "../migration" }
tempfile.workspace = true
